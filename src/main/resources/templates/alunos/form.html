<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário Alunos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="p-4">
<div class="container">
    <h1 th:text="${alunos.id != null} ? 'Editar Aluno' : 'Novo Aluno'"></h1>
    <form action="/alunos/salvar" method="post" th:object="${alunos}">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label for="nome" class="form-laber">Nome</label>
            <input type="text" th:field="*{nome}" class="form-control" id="nome" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="text" th:field="*{nome}" class="form-control" id="email" placeholder="email@exemplo" required>
        </div>
        <div class="mb-3">
            <label for="curso" class="form-label">Cursos</label>
            <select th:field="*{cursos.id}" class="form-select" id="curso" required>
                <option th:each="cur : ${cursos}" th:value="${cur.id}" th:text="${cur.nome}"
                        th:selected="${cur.id == aluno.curso?.id}">Curso</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="/alunos" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
