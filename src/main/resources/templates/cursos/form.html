<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário Cursos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="p-4">
<div class="container">
    <h1 th:text="${curso.id != null} ? 'Editar Curso' : 'Novo Curso'"></h1>
    <form action="/cursos/salvar" method="post" th:object="${curso}">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" th:field="*{nome}" class="form-control" id="nome" required>
        </div>
        <div class="mb-3">
            <label for="cargaHoraria" class="form-label">Carga Horária</label>
            <input type="number" aria-setsize="0.01" th:field="*{cargaHoraria}" class="form-control" id="cargaHoraria" required>
        </div>
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="/cursos" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
