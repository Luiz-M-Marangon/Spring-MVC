<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="fragments/head :: head('cursos')"></div>

<body class="p-4">
<div class="container">
    <h1 th:text="${curso.id != null} ? 'Editar Curso' : 'Novo Curso'"></h1>
    <form action="/cursos/salvar" method="post" th:object="${curso}">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" th:field="*{nome}" class="form-control" id="nome" required>
        </div>
        <div class="mb-3">
            <label for="cargaHoraria" class="form-label">Carga Horária</label>
            <input type="number" aria-setsize="0.01" th:field="*{cargaHoraria}" class="form-control" id="cargaHoraria" required>
        </div>
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="/cursos" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
